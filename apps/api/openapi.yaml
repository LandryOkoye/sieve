openapi: 3.1.0
info:
  title: SIEVE API
  version: 0.1.0
  description: General AI-agent defense API. Direct content inspection is independent of blockchain providers; Sui evidence is an optional integration.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/health/live:
    get:
      security: []
      summary: Check process liveness
      responses:
        '200':
          description: The API process is running.
  /api/v1/health/ready:
    get:
      security: []
      summary: Check required integration readiness and optional provider status
      responses:
        '200':
          description: All required integrations are available; optional integrations may be unconfigured.
        '503':
          description: One or more required integrations are unavailable or not configured.
  /api/v1/me:
    get:
      summary: Resolve the authenticated application user
      responses:
        '200':
          description: The caller's application user identifier.
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/agents:
    post:
      summary: Provision a protected agent and one-time API credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Agent created. The credential secret is returned only once.
          content:
            application/json:
              schema:
                type: object
                required: [agent, credential]
                properties:
                  agent: { type: object }
                  credential:
                    type: object
                    required: [secret, prefix]
                    properties:
                      secret: { type: string, writeOnly: true }
                      prefix: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/agents/{agentId}/credentials/rotate:
    post:
      summary: Rotate an agent credential and revoke all previous credentials
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: New credential secret returned once. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Agent not found or caller is not its workspace owner. }
  /api/v1/agents/{agentId}/credentials/revoke:
    post:
      summary: Revoke every active credential for an agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Agent credentials revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Agent not found or caller is not its workspace owner. }
  /api/v1/agent/inspect:
    post:
      security:
        - agentBearer: []
      summary: Inspect direct content before it enters an agent's trusted context
      description: Submitted content is inspected in memory and only its SHA-256 hash, bounded findings, and policy decision are persisted.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 65536 }
                sourceType: { type: string, maxLength: 80, default: direct_content }
                sourceRef: { type: string, maxLength: 2048, description: Hashed before persistence }
      responses:
        '201': { description: Evidence-backed assessment and enforced action created. }
        '200': { description: Existing assessment returned for an idempotent replay. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: Idempotency key was reused with different content or provenance. }
        '429': { description: Per-credential request limit exceeded; retry after the indicated interval. }
        '503': { description: Inspection dependencies are unavailable. }
  /api/v1/cases:
    post:
      summary: Queue a Sui object or transaction inspection
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                network: { type: string, enum: [mainnet, testnet] }
                digest: { type: string, description: Sui transaction digest }
                objectId: { type: string, description: Sui object ID }
              oneOf:
                - required: [digest]
                - required: [objectId]
      responses:
        '202':
          description: Case persisted and queued for asynchronous processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        '200':
          description: Existing case returned for an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The idempotency key was already used for a different request.
    get:
      summary: List the caller's cases
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, description: Opaque cursor returned as nextCursor }
      responses:
        '200':
          description: A page of owner-scoped inspection cases.
          content:
            application/json:
              schema:
                type: object
                required: [cases, limit, nextCursor]
                properties:
                  cases:
                    type: array
                    items: { $ref: '#/components/schemas/InspectionCase' }
                  limit: { type: integer }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/cases/{caseId}:
    parameters:
      - in: path
        name: caseId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve an owner-scoped case and its latest assessment
      responses:
        '200':
          description: Inspection case state and evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/retry:
    parameters:
      - in: path
        name: caseId
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Requeue an owner-scoped failed case
      responses:
        '202':
          description: Failed case has been queued for another attempt.
        '404':
          description: The case is not owned by the caller or is not failed.
  /api/v1/threat-memories:
    get:
      summary: List the caller's persisted threat memory writes
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, description: Opaque cursor returned as nextCursor }
      responses:
        '200':
          description: Owner-scoped memory records and write statuses.
          content:
            application/json:
              schema:
                type: object
                required: [memories, limit, nextCursor]
                properties:
                  memories:
                    type: array
                    items: { $ref: '#/components/schemas/ThreatMemoryWrite' }
                  limit: { type: integer }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/threat-memories/{memoryId}:
    parameters:
      - in: path
        name: memoryId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve one owner-scoped threat memory write
      responses:
        '200':
          description: Stored normalized record and write status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreatMemoryWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/threat-memories/{memoryId}/review:
    parameters:
      - in: path
        name: memoryId
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Review or promote a scoped threat-memory candidate
      description: Requires an authorized workspace reviewer. Promotion uploads a fresh active record and verifies Walrus expiry before changing PostgreSQL state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, rationale]
              properties:
                action: { type: string, enum: [validate, promote, reject, mark_false_positive, revoke, supersede] }
                rationale: { type: string, minLength: 12, maxLength: 500 }
                privacyReviewed: { type: boolean }
                corroboratingWorkspaceIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string }
      responses:
        '200':
          description: Review transition persisted with reviewer identity and rationale.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Lifecycle state changed or the candidate is not durably stored. }
        '503': { description: Walrus promotion or expiry verification is unavailable. }
  /api/v1/evaluations:
    post:
      summary: Start a fixture-based detector evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fixtureSetVersion]
              properties:
                fixtureSetVersion:
                  type: string
                  enum: [sieve-baseline-v1, sieve-heldout-v1, sieve-variants-v1, sieve-dev-v1, sieve-dev-v2, sieve-validation-v1, sieve-validation-v2]
      responses:
        '202':
          description: Evaluation was persisted and queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluationRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      summary: List the caller's evaluation runs
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, description: Opaque cursor returned as nextCursor }
      responses:
        '200':
          description: A page of owner-scoped evaluation runs.
          content:
            application/json:
              schema:
                type: object
                required: [evaluations, limit, nextCursor]
                properties:
                  evaluations:
                    type: array
                    items: { $ref: '#/components/schemas/EvaluationRun' }
                  limit: { type: integer }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/evaluations/{evaluationId}:
    parameters:
      - in: path
        name: evaluationId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve one owner-scoped evaluation run
      responses:
        '200':
          description: Evaluation status, fixture version, and metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluationRun' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: SIEVE agent credential
  responses:
    Unauthenticated:
      description: A valid bearer token is required.
    BadRequest:
      description: Request validation failed.
    NotFound:
      description: The case does not exist for this caller.
  schemas:
    InspectionCase:
      type: object
      required: [id, network, target, status, evidence, assessment, failureCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        network: { type: string, enum: [mainnet, testnet] }
        target:
          oneOf:
            - type: object
              required: [kind, digest]
              properties:
                kind: { const: transaction }
                digest: { type: string }
            - type: object
              required: [kind, objectId]
              properties:
                kind: { const: object }
                objectId: { type: string }
        status:
          type: string
          enum: [queued, fetching_evidence, assessing, completed, failed]
        evidence: { type: [object, 'null'] }
        assessment: { type: [object, 'null'] }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ThreatMemoryWrite:
      type: object
      required: [id, caseId, pattern, status, normalizedRecord, walrusJobId, blobId, failureCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        pattern: { type: string }
        status: { type: string, enum: [pending, accepted, uploaded, completed, failed] }
        normalizedRecord: { description: Normalized structured threat record }
        walrusJobId: { type: [string, 'null'] }
        blobId: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EvaluationRun:
      type: object
      required: [id, status, fixtureSetVersion, detectorConfig, metrics, failureCode, createdAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        fixtureSetVersion: { type: string }
        detectorConfig: { type: object }
        metrics: { oneOf: [{ $ref: '#/components/schemas/EvaluationMetrics' }, { type: 'null' }] }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    EvaluationMetrics:
      type: object
      required: [fixtureCount, attackCount, benignCount, truePositives, falsePositives, trueNegatives, falseNegatives, precision, recall, falsePositiveRate, categories, thresholds, acceptance]
      properties:
        fixtureCount: { type: integer }
        attackCount: { type: integer }
        benignCount: { type: integer }
        truePositives: { type: integer }
        falsePositives: { type: integer }
        trueNegatives: { type: integer }
        falseNegatives: { type: integer }
        precision: { type: [number, 'null'] }
        recall: { type: [number, 'null'] }
        falsePositiveRate: { type: [number, 'null'] }
        categories:
          type: object
          additionalProperties:
            type: object
            required: [support, detected, falsePositives]
            properties:
              support: { type: integer }
              detected: { type: integer }
              falsePositives: { type: integer }
        thresholds:
          type: object
          required: [minimumOverallRecall, minimumCategoryRecall, maximumFalsePositiveRate]
          properties:
            minimumOverallRecall: { type: number }
            minimumCategoryRecall: { type: number }
            maximumFalsePositiveRate: { type: number }
        acceptance:
          type: object
          required: [overallRecall, categoryRecall, falsePositiveRate, passed]
          properties:
            overallRecall: { type: boolean }
            categoryRecall:
              type: object
              additionalProperties: { type: boolean }
            falsePositiveRate: { type: boolean }
            passed: { type: boolean }

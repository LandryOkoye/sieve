global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: sieve-api
    scheme: https
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/secrets/sieve-metrics-token
    static_configs:
      - targets: [api.example.invalid:443]
